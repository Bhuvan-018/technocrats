<!DOCTYPE html>
<html>
<head>
<title>Fake News Detection Test</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:400px;
text-align:center;
}

textarea{
width:100%;
height:120px;
margin-top:10px;
}

button{
margin-top:15px;
padding:10px 20px;
background:blue;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:18px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h2>Fake News Detection</h2>

<textarea id="newsText" placeholder="Enter news text"></textarea>

<br>

<button onclick="predict()">Predict</button>

<p id="result"></p>

</div>

<script>

function predict(){

let text=document.getElementById("newsText").value

fetch("http://127.0.0.1:8000/predict",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
text:text
})

})

.then(response=>response.json())

.then(data=>{

console.log(data)

document.getElementById("result").innerHTML=
"Prediction: "+data.prediction

})

.catch(error=>{

document.getElementById("result").innerHTML=
"Error connecting to prediction service"

})

}

</script>

</body>
</html>
